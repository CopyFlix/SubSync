name: Sync Subtitle
on:
  repository_dispatch:
    types: [sync-subtitle]
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # تم زيادتها لأن Whisper يحتاج وقت معالجة أطول على الـ CPU
    container:
      image: ghcr.io/copyflix/subsync/sync-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Verify tools
        run: |
          ffmpeg -version 
          alass-cli --help
          
      - name: Run sync job
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
          INFOHASH: ${{ github.event.client_payload.infohash }}
          FILE_IDX: ${{ github.event.client_payload.file_idx }}
          FLIX_ID: ${{ github.event.client_payload.flix_id }}
          SUBTITLE_B64_GZ: ${{ github.event.client_payload.subtitle_b64_gz }}
          SUBTITLE_FILENAME: ${{ github.event.client_payload.subtitle_filename }}
          SUBTITLE_URL: ${{ github.event.client_payload.subtitle_url }}
          # WHISPER_MODEL: "base" # يمكنك تغييره إلى tiny لو أردت سرعة أكبر جداً بدقة أقل قليلاً
        run: python run_sync.py
