name: Sync Subtitle

on:
  repository_dispatch:
    types: [sync-subtitle]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install alass-cli
        run: |
          set -e
          echo "جاري البحث عن رابط النسخة الصحيحة لـ Linux من أحدث إصدار..."
          ASSET_URL=$(curl -s https://api.github.com/repos/kaegi/alass/releases/latest \
            | grep "browser_download_url" \
            | grep -i "linux" \
            | cut -d '"' -f 4 \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "فشل العثور على أصل (asset) لينكس في أحدث إصدار."
            echo "الأصول المتاحة فعليًا في هذا الإصدار:"
            curl -s https://api.github.com/repos/kaegi/alass/releases/latest | grep "browser_download_url"
            exit 1
          fi

          echo "تحميل: $ASSET_URL"
          curl -L -o alass_download "$ASSET_URL"

          mkdir -p alass_bin
          # الملف قد يكون zip مضغوط أو باينري مباشر - نتعامل مع الحالتين
          if file alass_download | grep -qi "zip"; then
            unzip -o alass_download -d alass_bin
          else
            cp alass_download alass_bin/alass-cli
          fi

          # نلقط أول ملف تنفيذي جواه (بغض النظر عن اسمه بالظبط)
          BIN_PATH=$(find alass_bin -type f | head -n 1)
          echo "الملف التنفيذي الموجود: $BIN_PATH"
          sudo mv "$BIN_PATH" /usr/local/bin/alass-cli
          sudo chmod +x /usr/local/bin/alass-cli
          alass-cli --help

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run sync job
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
          INFOHASH: ${{ github.event.client_payload.infohash }}
          SUBTITLE_URL: ${{ github.event.client_payload.subtitle_url }}
        run: python run_sync.py
