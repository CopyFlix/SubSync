name: Sync Subtitle

on:
  repository_dispatch:
    types: [sync-subtitle]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache alass-cli
        id: cache-alass
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/alass-cli
          key: alass-cli-linux-v2

      - name: Install alass-cli
        if: steps.cache-alass.outputs.cache-hit != 'true'
        run: |
          set -e
          ASSET_URL=$(curl -s https://api.github.com/repos/kaegi/alass/releases/latest \
            | grep "browser_download_url" \
            | grep -i "linux" \
            | cut -d '"' -f 4 \
            | head -n 1)

          curl -L -o alass_download "$ASSET_URL"
          mkdir -p alass_bin
          if file alass_download | grep -qi "zip"; then
            unzip -o alass_download -d alass_bin
          else
            cp alass_download alass_bin/alass-cli
          fi

          mkdir -p ~/.local/bin
          BIN_PATH=$(find alass_bin -type f | head -n 1)
          mv "$BIN_PATH" ~/.local/bin/alass-cli
          chmod +x ~/.local/bin/alass-cli

      - name: Add alass-cli to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify alass-cli
        run: alass-cli --help

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run sync job
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
          INFOHASH: ${{ github.event.client_payload.infohash }}
          FILE_IDX: ${{ github.event.client_payload.file_idx }}
          FLIX_ID: ${{ github.event.client_payload.flix_id }}
          SUBTITLE_B64_GZ: ${{ github.event.client_payload.subtitle_b64_gz }}
          SUBTITLE_FILENAME: ${{ github.event.client_payload.subtitle_filename }}
          SUBTITLE_URL: ${{ github.event.client_payload.subtitle_url }}
        run: python run_sync.py
